name: CI Workflow - Docker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build a Docker image named task-manager from the Dockerfile
      - name: Build Docker image
        run: |
          docker build -t task-manager:latest .

      # Step 3: Run the container, passing the GitHub username in as GITHUB_USER
      - name: Run Docker container
        run: |
          docker run --rm -e GITHUB_USER="${{ github.actor }}" task-manager:latest